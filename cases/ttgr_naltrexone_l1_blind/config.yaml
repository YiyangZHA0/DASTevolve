max_iterations: 4
checkpoint_interval: 1
log_level: INFO
random_seed: 20260803
language: python
file_suffix: .py
diff_based_evolution: true
max_code_length: 28000
early_stopping_patience: null
convergence_threshold: 0.0001
early_stopping_metric: final_energy

memory_policy:
  adaptive_prior_mode: disabled
  inner_state_scope: evaluation

llm:
  provider: openai
  api_base: ${OPENAI_API_BASE}
  api_key: ${OPENAI_API_KEY}
  name: ${ASTEVOLVE_LLM_MODEL}
  models:
    - name: ${ASTEVOLVE_LLM_MODEL}
      weight: 1.0
      reasoning_effort: medium
  temperature: 0.30
  max_tokens: 10000
  timeout: 240
  retries: 3
  retry_delay: 5
  random_seed: 20260803
  reasoning_effort: medium

prompt:
  proposal_mode: structured_strategy_v1
  hierarchical_audit_v2: true
  num_top_programs: 1
  num_diverse_programs: 1
  use_template_stochasticity: false
  include_artifacts: true
  max_artifact_bytes: 32768
  max_artifact_total_bytes: 65536
  complete_artifacts:
    - migration_frontier
    - residue_evidence_prompt_digest
  artifact_priority:
    - structured_ast_proposal_audit
    - migration_frontier
    - residue_evidence_prompt_digest
    - ast_revision_report
    - evaluator_report
    - structure_metrics
    - mutation_history
    - effective_phenotype_identity
  optimizer_memory_max_chars: 8192
  hierarchical_design_max_chars: 24576
  candidate_diff_retries: 4

database:
  in_memory: true
  population_size: 24
  archive_size: 16
  num_islands: 4
  outer_effective_phenotype_enabled: true
  outer_population_policy_version: v9
  outer_parent_selection_mode: mixture
  outer_parent_selection_mixture:
    elite: 0.20
    weighted: 0.50
    uniform: 0.30
  outer_behavior_bin_dimensions:
    - feasibility
    - functional_scope
    - structural_scope
    - mutation_burden
    - action_coverage
  outer_robustness_metrics:
    - ttgr_target_pocket_proxy
    - ttgr_counter_relative_margin_proxy
    - ttgr_allosteric_transition_proxy
    - ttgr_fold_guardrail
    - ttgr_dimer_guardrail
    - multistate_score
  proposal_wave_size: 4
  strategy_epoch_candidate_interval: 4
  elite_selection_ratio: 0.20
  exploration_ratio: 0.30
  exploitation_ratio: 0.50
  migration_interval: 4
  migration_interval_scope: per_island
  migration_rate: 0.10
  random_seed: 20260803
  feature_dimensions:
    - complexity
    - diversity
  feature_bins: 8
  optimizer_memory_enabled: true
  optimizer_memory_recent_limit: 12
  optimizer_memory_best_limit: 4
  ast_scheduler_enabled: true
  ast_parent_selection_weight: 0.30
  island_role_selection_weight: 0.35
  ast_scheduler_stagnation_window: 4
  ast_scheduler_stagnation_min_delta: 0.0001
  island_specialization_enabled: true
  island_roles:
    - role_id: ttgr_target_pocket
      name: Naltrexone target pocket
      focus: Improve the naltrexone pocket proxy while respecting all sequence, fold, and dimer gates.
      soft_objectives: [target pocket contacts, ligand-state confidence, pocket-node coverage]
      complementary_roles: [ttgr_counter_margin, ttgr_coupling_apo, ttgr_robustness]
    - role_id: ttgr_counter_margin
      name: Relative counter margin
      focus: Improve target-over-End/Tam structural margins without interpreting weak contacts as zero response.
      soft_objectives: [target minus End margin, target minus Tam margin, target retention]
      complementary_roles: [ttgr_target_pocket, ttgr_coupling_apo, ttgr_robustness]
    - role_id: ttgr_coupling_apo
      name: Coupling and apo guardrail
      focus: Explore hinge-to-DBD transition hypotheses while retaining apo fold and dimer proxies.
      soft_objectives: [hinge movement proxy, DBD movement proxy, apo confidence]
      complementary_roles: [ttgr_target_pocket, ttgr_counter_margin, ttgr_robustness]
    - role_id: ttgr_robustness
      name: Robust recombination
      focus: Recombine evidence-supported nodes with low mutation burden and strong worst-state structural quality.
      soft_objectives: [worst-state confidence, dimer integrity, low mutation burden, node diversity]
      complementary_roles: [ttgr_target_pocket, ttgr_counter_margin, ttgr_coupling_apo]
  experiment_registry_enabled: true
  experiment_registry_lease_seconds: 7200
  experiment_registry_retry_failed: true
  experiment_registry_replicate_policy: reject

hierarchical_design:
  enabled: false
  global_strategist_enabled: false
  proposal_critic_enabled: false
  llm_critic_enabled: false
  reasoning_audit_enabled: true
  strategy_refresh_on_stagnation: false
  global_strategy_retries: 1
  evidence_max_chars: 24576
  node_tenure: 2
  exploration_window: 4
  outside_incumbent_execution_quota: 0.50
  min_segments_per_window: 2

evaluator:
  timeout: 7200
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  distributed: false
  use_llm_feedback: false
  enable_artifacts: true
  max_artifact_storage: 536870912

evolution_trace:
  enabled: true
  format: jsonl
  include_code: false
  include_prompts: true
  buffer_size: 1
  compress: false
