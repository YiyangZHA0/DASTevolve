max_iterations: 50
checkpoint_interval: 5
log_level: INFO
random_seed: 20260803
language: python
file_suffix: .py
diff_based_evolution: true
max_code_length: 98304
early_stopping_patience: null
convergence_threshold: 0.0001
early_stopping_metric: final_energy

memory_policy:
  # Only accepted winners may update the cross-generation prior. Every inner
  # evaluation still starts with isolated run-local search state.
  adaptive_prior_mode: winner_commit
  inner_state_scope: run

llm:
  provider: openai
  api_base: ${ASTEVOLVE_LLM_API_BASE}
  api_key: ${ASTEVOLVE_LLM_API_KEY}
  name: ${ASTEVOLVE_LLM_MODEL}
  models:
    - name: ${ASTEVOLVE_LLM_MODEL}
      weight: 1.0
      reasoning_effort: medium
  temperature: 0.30
  max_tokens: 12000
  timeout: 240
  retries: 4
  retry_delay: 5
  random_seed: 20260803
  reasoning_effort: medium

prompt:
  proposal_mode: structured_design_action_v1
  # Require every accepted LLM child to provide executable exact amino-acid
  # control: at least one soft per-position distribution and at least one
  # non-null required_mutation. The compiler binds both to active Node
  # ownership and the case-owned hard alphabet before MCTS/GPU execution.
  require_position_distributions: true
  hierarchical_audit_v2: true
  num_top_programs: 2
  num_diverse_programs: 2
  use_template_stochasticity: true
  include_artifacts: true
  # The full 264-residue safety digest and migration frontier must not be
  # truncated: omitting low-ranked residues would silently reduce Node freedom.
  max_artifact_bytes: 131072
  max_artifact_total_bytes: 262144
  complete_artifacts:
    - migration_frontier
    - residue_evidence_prompt_digest
    - immutable_sequence_reference
  artifact_priority:
    - design_action
    - compiled_design_action
    - mutation_ownership_ledger
    - immutable_sequence_reference
    - structured_design_action_proposal_audit
    - structured_ast_proposal_audit
    - migration_frontier
    - residue_evidence_prompt_digest
    - parent_sequence_lineage
    - best_seqs
    - structure_finalist_feedback
    - llm_feedback_summary
    - energy_feedback
    - ast_revision_report
    - residue_evidence_catalog_summary
    - effective_phenotype_identity
    - edit_contract_envelope
    - accepted_runtime_artifact
    - strategy_schema_report
    - structure_metrics
    - search_artifacts
    - mutation_history
    - graph_patch
    - evaluator_report
    - causal_trace
  optimizer_memory_max_chars: 24576
  hierarchical_design_max_chars: 49152
  # Structured retries are LLM-only and never consume GPU until the complete
  # AST/audit transaction passes. Twelve allows cumulative schema repair.
  candidate_diff_retries: 12

database:
  in_memory: true
  # Step acceptance audits run after the outer-loop process has exited.  Keep
  # every controller artifact on disk so small DesignAction/ownership receipts
  # cannot disappear with the in-memory database.
  artifact_size_threshold: 0
  population_size: 160
  archive_size: 80
  num_islands: 4
  outer_effective_phenotype_enabled: true
  outer_population_policy_version: v9
  outer_parent_selection_mode: mixture
  outer_parent_selection_mixture:
    elite: 0.15
    weighted: 0.55
    uniform: 0.30
  outer_behavior_bin_dimensions:
    - feasibility
    - functional_scope
    - structural_scope
    - mutation_burden
    - action_coverage
    - operator_scope
    - strategy_novelty
    - sequence_novelty
  outer_robustness_metrics:
    - aph_sequence_integrity
    - aph_mutation_scope_integrity
    - aph_global_fold_preservation
    - aph_verified_core_preservation
    - aph_kanamycin_contact_preservation
    - aph_kanamycin_pose_preservation
    - aph_mg_geometry_preservation
    - aph_clash_free
    - aph_kanamycin_label_compatibility
    - aph_sequence_plausibility
    - aph_repeat_robustness
    - aph_sequence_diversity
    - worst_case_score
    - seed_score_std
    - multistate_score
    - clash_count
    - node_plddt_min
  # One proposal per island is frozen into one logical outer generation. A
  # single GPU evaluates the four proposals serially and commits afterwards.
  proposal_wave_size: 4
  strategy_epoch_candidate_interval: 8
  elite_selection_ratio: 0.15
  exploration_ratio: 0.30
  exploitation_ratio: 0.55
  # Keep specialist parent pools isolated for two complete 4-island waves.
  migration_interval: 8
  migration_interval_scope: per_island
  migration_rate: 0.10
  random_seed: 20260803
  feature_dimensions:
    - complexity
    - diversity
  feature_bins: 10
  optimizer_memory_enabled: true
  optimizer_memory_recent_limit: 32
  optimizer_memory_best_limit: 12
  ast_scheduler_enabled: true
  ast_parent_selection_weight: 0.30
  island_role_selection_weight: 0.45
  # Role evidence may break near-objective ties, but never feasibility. The
  # declarative scorer records this tolerance in every survivor decision.
  island_role_survivor_objective_tolerance: 0.03
  ast_scheduler_stagnation_window: 6
  ast_scheduler_stagnation_min_delta: 0.0001
  island_specialization_enabled: true
  executable_island_directives_enabled: true
  island_roles:
    - role_id: global_fold_rescue
      name: APH global-fold and verified-core rescue
      focus: >-
        Among globally feasible candidates, retain the strongest same-protocol
        recovery of the weakest global-fold margin while preserving the
        verified catalytic core and clash-free geometry.
      soft_objectives:
        - aph_global_fold_preservation
        - aph_verified_core_preservation
        - aph_clash_free
      metric_terms:
        - metric: aph_global_fold_preservation
          direction: maximize
          transform: identity
          weight: 0.55
          missing_policy: fail
        - metric: aph_verified_core_preservation
          direction: maximize
          transform: identity
          weight: 0.30
          missing_policy: fail
        - metric: aph_clash_free
          direction: maximize
          transform: identity
          weight: 0.15
          missing_policy: fail
      search_scope:
        postures: [conservative, balanced, repair, revert]
        design_tiers: [level1, level2, frontier]
        preferred_position_source: incumbent_nodes_and_low_risk_frontier
        preferred_active_positions: [3, 4]
        allow_frontier_migration: false
      complementary_roles: [kan_pose_contact_rescue, repeat_robustness]

    - role_id: kan_pose_contact_rescue
      name: KAN contact, pose, and Mg-coupling rescue
      focus: >-
        Maximize the weakest KAN contact/pose/Mg margin while retaining fold
        feasibility; use label and sequence priors only as late tie-breakers.
      soft_objectives:
        - aph_kanamycin_contact_preservation
        - aph_kanamycin_pose_preservation
        - aph_mg_geometry_preservation
        - aph_global_fold_preservation
        - aph_sequence_diversity
      metric_terms:
        - metric: aph_kanamycin_contact_preservation
          direction: maximize
          transform: identity
          weight: 0.40
          missing_policy: fail
        - metric: aph_kanamycin_pose_preservation
          direction: maximize
          transform: identity
          weight: 0.35
          missing_policy: fail
        - metric: aph_mg_geometry_preservation
          direction: maximize
          transform: identity
          weight: 0.15
          missing_policy: fail
        - metric: aph_global_fold_preservation
          direction: maximize
          transform: identity
          weight: 0.10
          missing_policy: fail
      search_scope:
        postures: [conservative, balanced, repair, revert]
        design_tiers: [level1, level2, frontier]
        preferred_position_source: five_DMS_seed_positions_first
        preferred_active_positions: [3, 5]
        allow_frontier_migration: false
      complementary_roles: [global_fold_rescue, node_region_explorer, repeat_robustness]

    - role_id: node_region_explorer
      name: Evidence-bounded Node and residue-region explorer
      focus: >-
        Exercise create/delete/migrate/resize/split/merge/rewire actions,
        probe non-incumbent eligible segments, and revise soft amino-acid
        guidance without crossing protected spans or hard allowlists.
      soft_objectives:
        - aph_sequence_diversity
        - aph_sequence_plausibility
        - aph_global_fold_preservation
        - outer structural/function/action scope novelty
      metric_terms:
        - metric: aph_sequence_diversity
          direction: maximize
          transform: identity
          weight: 0.30
          missing_policy: neutral
        - metric: aph_sequence_plausibility
          direction: maximize
          transform: identity
          weight: 0.25
          missing_policy: neutral
        - metric: aph_global_fold_preservation
          direction: maximize
          transform: identity
          weight: 0.15
          missing_policy: fail
        - metric: aph_repeat_robustness
          direction: maximize
          transform: identity
          weight: 0.10
          missing_policy: neutral
        - metric: primary_node_engagement
          direction: maximize
          transform: identity
          weight: 0.20
          missing_policy: fail
      search_scope:
        postures: [conservative, balanced, exploratory, repair, revert]
        design_tiers: [frontier]
        preferred_position_source: residue_evidence_catalog_ranked_new_segments
        preferred_active_positions: [4, 8]
        allow_frontier_migration: true
        require_non_incumbent_segment_probe: true
        require_primary_node_engagement: true
        new_node_proposal_budget_fraction: 0.30
        matched_node_ablation: true
        structural_adjacency_sources:
          - KAN_contact_shell_second_neighbors
          - ligand_pose_sidechain_network
          - Mg_KAN_pose_coupled_residues
          - weak_fold_to_core_support_paths
        structural_adjacency_filter:
          require_catalog_eligible: true
          require_high_reference_confidence: true
          reject_protected_or_direct_contact_shell: true
          reject_unresolved_residues: true
      complementary_roles: [global_fold_rescue, kan_pose_contact_rescue, repeat_robustness]

    - role_id: repeat_robustness
      name: Chain-repeat, seed, and safety robustness
      focus: >-
        Prefer candidates with strong worst-case preservation across the 1ND4
        chain-A/chain-B repeat and declared prediction seeds, low variance, no
        severe clashes, and a compact mutation burden.
      soft_objectives:
        - aph_repeat_robustness
        - worst_case_score
        - seed_score_std
        - clash_count
        - aph_global_fold_preservation
      metric_terms:
        - metric: aph_repeat_robustness
          direction: maximize
          transform: identity
          weight: 0.35
          missing_policy: neutral
        - metric: worst_case_score
          direction: maximize
          transform: identity
          weight: 0.25
          missing_policy: neutral
        - metric: seed_score_std
          direction: minimize
          transform: identity
          weight: 0.15
          missing_policy: neutral
        - metric: aph_clash_free
          direction: maximize
          transform: identity
          weight: 0.15
          missing_policy: fail
        - metric: aph_global_fold_preservation
          direction: maximize
          transform: identity
          weight: 0.10
          missing_policy: fail
      search_scope:
        postures: [conservative, balanced, repair, revert]
        design_tiers: [level1, level2, frontier]
        preferred_position_source: active_nodes_low_mutation_burden
        preferred_active_positions: [3, 4]
        allow_frontier_migration: false
        prefer_low_mutation_burden: true
      complementary_roles: [global_fold_rescue, kan_pose_contact_rescue, node_region_explorer]
  experiment_registry_enabled: true
  experiment_registry_lease_seconds: 7200
  experiment_registry_retry_failed: true
  experiment_registry_replicate_policy: reject

hierarchical_design:
  enabled: true
  global_strategist_enabled: true
  proposal_critic_enabled: true
  llm_critic_enabled: false
  reasoning_audit_enabled: true
  strategy_refresh_on_stagnation: true
  global_strategy_retries: 2
  evidence_max_chars: 49152
  node_tenure: 3
  exploration_window: 4
  outside_incumbent_execution_quota: 0.50
  min_segments_per_window: 2

evaluator:
  timeout: 7200
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  distributed: false
  use_llm_feedback: false
  enable_artifacts: true
  max_artifact_storage: 1073741824

evolution_trace:
  enabled: true
  format: jsonl
  include_code: false
  include_prompts: true
  buffer_size: 1
  compress: false
