      - L
      '238':
      - D
      - E
      - N
    frontier:
      source: data://aph3iia_kanamycin_active_site_preservation/data/residue_evidence_catalog.json
      rule: use metadata.frontier_hard_allowed_residues for each active position
      unrestricted_20aa_sampling: false
    LLM_authority: The LLM may create/delete/migrate/resize/split/merge/rewire Nodes, select 8-32 eligible
      positions, allocate mutation budget, and change soft favored/disfavored guidance. It cannot add
      a position outside catalog eligibility or a residue identity absent from that position's hard catalog.
  search_postures:
    conservative:
      tier: active_run_selected_level1_level2_or_frontier
      behavior: retain compact incumbent Nodes and conservative soft residue guidance
    balanced:
      tier: active_run_selected_level1_level2_or_frontier
      behavior: allow migration/resize and balanced action intensity inside the selected hard tier
    exploratory:
      tier: active_run_selected_level1_level2_or_frontier
      behavior: in frontier mode probe eligible non-incumbent segments and diversify soft guidance
    repair:
      tier: active_run_selected_level1_level2_or_frontier
      behavior: diagnose one failed gate and change only implicated Nodes
    revert:
      tier: active_run_selected_level1_level2_or_frontier
      behavior: restore a trusted parent and return retired positions to the case reference
    invariant: ASTEVOLVE_APH_DESIGN_TIER is launch-locked. The LLM may change topology, selected positions,
      and soft residue preferences inside that tier; it cannot weaken protected spans or case-owned hard
      amino-acid alphabets.
  node_control_prior:
    proposal_semantics: complete_desired_AST_not_delta
    allowed_decision_actions:
    - keep
    - create
    - delete
    - migrate
    - resize
    - split
    - merge
    - revise
    - rewire
    - mixed
    - revert
    evidence_requirements:
    - every active position cites a catalog evidence_id
    - every active position is catalog eligible and above the safety floor
    - active Nodes are non-overlapping and remain inside compiled segment boundaries
    - protected residues and functional operators remain controller-owned
    preferred_edit_order:
    - repair a diagnosed hard-gate or evidence failure
    - refine a feasible incumbent inside its current tier
    - test a complementary Node topology at the same tier
    - migrate to a new catalog segment only in explicit exploratory mode
  evaluator_prior:
    evaluator_id: aph3iia_kanamycin
    global_hard_terms:
    - aph_sequence_integrity
    - aph_mutation_scope_integrity
    - aph_global_fold_preservation
    - aph_verified_core_preservation
    - aph_kanamycin_contact_preservation
    - aph_kanamycin_pose_preservation
    - aph_mg_geometry_preservation
    - aph_clash_free
    soft_or_audit_terms:
    - aph_kanamycin_label_compatibility
    - aph_sequence_plausibility
    - aph_repeat_robustness
    - aph_sequence_diversity
    raw_metric_policy: Preserve raw provider, model, seed, state, RMSD, contact, Mg, clash, and missingness
      fields alongside every normalized/composite value.
    threshold_policy: Absolute imported thresholds are provisional until WT is run under the exact same
      provider versions and seed set. Provider-specific WT noninferiority must not be pooled across providers.
    sequence_prior_reference: null
    sequence_prior_reference_status: unavailable_until_same_runtime_WT_is_sealed
    hidden_label_policy: Exact selected-site DMS values and wet MIC rows are evaluator/post-hoc evidence
      only in closed-book runs. Never expose them in the residue evidence prompt digest or optimizer memory.
  island_prior:
    hard_gates_shared: true
    roles:
      core_geometry_guard:
        emphasis: fold, verified core, KAN contacts/pose, Mg geometry, clashes
        complementary_roles:
        - kan_function_ranker
        - repeat_robustness
      kan_function_ranker:
        emphasis: hidden-label compatibility and independent sequence plausibility after feasibility
        complementary_roles:
        - core_geometry_guard
        - node_region_explorer
        - repeat_robustness
      node_region_explorer:
        emphasis: non-incumbent segment probes, Node resize/migration, and sequence/topology diversity
        complementary_roles:
        - core_geometry_guard
        - kan_function_ranker
        - repeat_robustness
      repeat_robustness:
        emphasis: chain-repeat/seed worst-case, variance, clashes, and compact mutation burden
        complementary_roles:
        - core_geometry_guard
        - kan_function_ranker
        - node_region_explorer
    migration_rule: Share immutable evaluated candidate IDs only; re-score target-role soft evidence,
      preserve provenance, and never let an infeasible migrant replace a feasible resident.
  information_partition:
    generator_may_read:
    - WT sequence and active tier contract
    - sanitized residue evidence IDs and safety/geometry/conservation summaries
    - 1ND4 KAN/Mg state and declared protected nodes
    - trusted parent lineage and computational evaluator feedback
    generator_must_not_read:
    - exact DMS values in closed-book runs
    - wet MIC rows before rank and hash freeze
    - other-drug labels when optimizing the kanamycin-preservation objective
