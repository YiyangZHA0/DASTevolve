max_iterations: 50
checkpoint_interval: 10
log_level: INFO
random_seed: 20260911
language: python
file_suffix: .py
diff_based_evolution: true
max_code_length: 48000
early_stopping_patience: null
convergence_threshold: 0.0001
early_stopping_metric: final_energy
memory_policy:
  adaptive_prior_mode: 'off'
  inner_state_scope: run
llm:
  provider: openai
  api_base: ${ASTEVOLVE_LLM_API_BASE}
  api_key: ${ASTEVOLVE_LLM_API_KEY}
  primary_model: ${ASTEVOLVE_LLM_MODEL}
  temperature: 0.35
  max_tokens: 10000
  timeout: 240
  retries: 4
  retry_delay: 5
  random_seed: 20260911
  reasoning_effort: medium
prompt:
  template_dir: prompts
  proposal_mode: structured_strategy_v1
  hierarchical_audit_v2: false
  num_top_programs: 2
  num_diverse_programs: 1
  use_template_stochasticity: true
  include_artifacts: true
  max_artifact_bytes: 32768
  max_artifact_total_bytes: 65536
  artifact_priority:
  - optimizer_memory_summary
  - llm_feedback_summary
  - residue_evidence_prompt_digest
  - migration_frontier
  - energy_feedback
  - evaluator_report
  - graph_patch
  candidate_diff_retries: 5
database:
  in_memory: true
  population_size: 64
  archive_size: 32
  num_islands: 4
  outer_effective_phenotype_enabled: true
  outer_population_policy_version: v9
  proposal_wave_size: 1
  migration_interval: 5
  migration_rate: 0.1
  random_seed: 20260911
  feature_dimensions:
  - complexity
  - diversity
  feature_bins: 10
  island_specialization_enabled: true
  island_roles:
  - role_id: interface_engagement
    name: ASYN hotspot interface
    focus: Improve binder-ASYN interface quality and hotspot localization.
    soft_objectives:
    - interface quality
    - hotspot contact fraction
    - ipTM
    metric_terms:
    - {metric: asyn_interface_quality, direction: maximize, transform: identity, weight: 0.6, missing_policy: fail}
    - {metric: asyn_hotspot_localization, direction: maximize, transform: identity, weight: 0.4, missing_policy: fail}
  - role_id: binder_fold
    name: Binder holo foldability
    focus: Improve binder confidence inside the holo ASYN complex while retaining
      interface potential.
    soft_objectives:
    - binder holo pLDDT
    - binder node confidence
    metric_terms:
    - {metric: asyn_binder_holo_confidence, direction: maximize, transform: identity, weight: 0.7, missing_policy: fail}
    - {metric: asyn_binder_holo_confidence_floor, direction: maximize, transform: identity, weight: 0.3, missing_policy: fail}
  - role_id: topology_exploration
    name: Binder topology exploration
    focus: Explore under-sampled binder tiles and alternative contact topologies.
    soft_objectives:
    - holo tile coverage
    - sequence novelty
    - contact topology
    metric_terms:
    - {metric: asyn_hotspot_localization, direction: maximize, transform: identity, weight: 0.8, missing_policy: fail}
    - {metric: asyn_interface_quality, direction: maximize, transform: identity, weight: 0.2, missing_policy: fail}
  - role_id: developability
    name: Developability and safety
    focus: Control hydrophobicity, homopolymers, cysteine burden, and clashes.
    soft_objectives:
    - sequence developability
    - clash-free interface
    metric_terms:
    - {metric: asyn_binder_developability, direction: maximize, transform: identity, weight: 0.6, missing_policy: fail}
    - {metric: asyn_binder_hydrophobic_guard, direction: maximize, transform: identity, weight: 0.2, missing_policy: fail}
    - {metric: asyn_interface_clash_guard, direction: maximize, transform: identity, weight: 0.2, missing_policy: fail}
  experiment_registry_replicate_policy: reject
hierarchical_design:
  enabled: false
  global_strategist_enabled: false
  proposal_critic_enabled: false
  reasoning_audit_enabled: false
  strategy_refresh_on_stagnation: false
  global_strategy_retries: 2
  node_tenure: 3
  exploration_window: 5
  required_hard_gate_metrics:
  - hard_gate_pass
  - asyn_target_sequence_integrity
  - asyn_binder_sequence_validity
  - asyn_state_evidence_complete
  - asyn_binder_hydrophobic_guard
  - asyn_hotspot_contact_guard
  - asyn_interface_clash_guard
  llm_critic_enabled: false
evaluator:
  timeout: 7200
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  distributed: false
  use_llm_feedback: false
  enable_artifacts: true
