max_iterations: 50
checkpoint_interval: 5
max_tasks_per_child: 1
log_level: INFO
random_seed: 20260803
language: python
file_suffix: .py
diff_based_evolution: true
max_code_length: 32000
early_stopping_patience: null
convergence_threshold: 0.0001
early_stopping_metric: final_energy

memory_policy:
  adaptive_prior_mode: "winner_commit"
  inner_state_scope: run

llm:
  provider: openai
  api_base: ${ASTEVOLVE_LLM_API_BASE}
  api_key: ${ASTEVOLVE_LLM_API_KEY}
  name: ${ASTEVOLVE_LLM_MODEL}
  models:
    - name: ${ASTEVOLVE_LLM_MODEL}
      weight: 1.0
      reasoning_effort: medium
  temperature: 0.25
  max_tokens: 12000
  timeout: 240
  retries: 3
  retry_delay: 5
  random_seed: 20260803
  reasoning_effort: medium

prompt:
  proposal_mode: structured_strategy_v1
  hierarchical_audit_v2: true
  num_top_programs: 2
  num_diverse_programs: 1
  use_template_stochasticity: false
  include_artifacts: true
  max_artifact_bytes: 32768
  max_artifact_total_bytes: 90112
  complete_artifacts:
    - migration_frontier
    - residue_evidence_prompt_digest
  artifact_priority:
    - structured_ast_proposal_audit
    - migration_frontier
    - residue_evidence_prompt_digest
    - ast_revision_report
    - parent_sequence_lineage
    - evaluator_report
  optimizer_memory_max_chars: 12288
  candidate_diff_retries: 4

database:
  in_memory: true
  population_size: 32
  archive_size: 16
  num_islands: 4
  outer_effective_phenotype_enabled: true
  outer_population_policy_version: v9
  outer_parent_selection_mode: mixture
  outer_parent_selection_mixture:
    elite: 0.20
    weighted: 0.55
    uniform: 0.25
  outer_behavior_bin_dimensions:
    - feasibility
    - functional_scope
    - structural_scope
    - mutation_burden
    - action_coverage
    - operator_scope
  outer_robustness_metrics:
    - all_nodes_native_recovery
    - cdr_all_a_escape
    - l0_native_recovery
    - l1_native_recovery
    - l2_native_recovery
    - mutation_sparsity
    - protenix_structure_quality
    - protenix_interface_confidence
    - protenix_interface_plddt
    - protenix_interface_pae_quality
    - protenix_contact_quality
    - developability_score
    - sabdab_vhh_plausibility
    - hard_gate_pass

  proposal_wave_size: 1
  strategy_epoch_candidate_interval: 8
  elite_selection_ratio: 0.20
  exploration_ratio: 0.25
  exploitation_ratio: 0.55
  migration_interval: 8
  migration_interval_scope: per_island
  migration_rate: 0.10
  random_seed: 20260803
  feature_dimensions:
    - complexity
    - diversity
  feature_bins: 10
  optimizer_memory_enabled: true
  optimizer_memory_recent_limit: 12
  optimizer_memory_best_limit: 4
  ast_scheduler_enabled: true
  ast_parent_selection_weight: 0.25
  island_role_selection_weight: 0.40
  island_role_survivor_objective_tolerance: 0.02
  ast_scheduler_stagnation_window: 4
  ast_scheduler_stagnation_min_delta: 0.0001
  island_specialization_enabled: true
  island_roles:
    - role_id: contact_native_exploit
      name: L0 contact recovery with Protenix interface guidance
      focus: Recover the three L0 contact identities while prioritizing Protenix interface confidence, PAE, and contact geometry.
      soft_objectives: [L0 recovery, Protenix interface confidence, Protenix interface PAE, Protenix contact quality, sequence integrity]
      complementary_roles: [cdr3_guarded_explore, maturation_epistasis]
      metric_terms:
        - {metric: l0_native_recovery, direction: maximize, transform: identity, weight: 0.30, missing_policy: fail}
        - {metric: cdr_all_a_escape, direction: maximize, transform: identity, weight: 0.10, missing_policy: fail}
        - {metric: protenix_interface_confidence, direction: maximize, transform: identity, weight: 0.25, missing_policy: fail}
        - {metric: protenix_interface_pae_quality, direction: maximize, transform: identity, weight: 0.15, missing_policy: fail}
        - {metric: protenix_contact_quality, direction: maximize, transform: identity, weight: 0.15, missing_policy: fail}
        - {metric: fixed_residue_integrity, direction: maximize, transform: identity, weight: 0.05, missing_policy: fail}
    - role_id: cdr3_guarded_explore
      name: Protenix-led L1 CDR3 conformation
      focus: Recover non-L0 CDR3 positions while improving Protenix interface confidence and local geometry.
      soft_objectives: [L1 recovery, Protenix interface confidence, Protenix interface pLDDT, Protenix interface PAE, sequence integrity]
      complementary_roles: [contact_native_exploit, robustness_falsification]
      metric_terms:
        - {metric: l1_native_recovery, direction: maximize, transform: identity, weight: 0.25, missing_policy: fail}
        - {metric: cdr_all_a_escape, direction: maximize, transform: identity, weight: 0.10, missing_policy: fail}
        - {metric: sabdab_cdr3_similarity, direction: maximize, transform: identity, weight: 0.10, missing_policy: fail}
        - {metric: protenix_interface_confidence, direction: maximize, transform: identity, weight: 0.25, missing_policy: fail}
        - {metric: protenix_interface_plddt, direction: maximize, transform: identity, weight: 0.15, missing_policy: fail}
        - {metric: protenix_interface_pae_quality, direction: maximize, transform: identity, weight: 0.15, missing_policy: fail}
        - {metric: protenix_contact_quality, direction: maximize, transform: identity, weight: 0.05, missing_policy: fail}
        - {metric: fixed_residue_integrity, direction: maximize, transform: identity, weight: 0.05, missing_policy: fail}
    - role_id: maturation_epistasis
      name: Protenix-screened L2 CDR1/CDR2 epistasis
      focus: Explore the five L2 positions with Protenix structure feedback and light developability control.
      soft_objectives: [L2 recovery, Protenix contact quality, Protenix structure quality, Protenix interface confidence, developability, sequence integrity]
      complementary_roles: [contact_native_exploit, robustness_falsification]
      metric_terms:
        - {metric: l2_native_recovery, direction: maximize, transform: identity, weight: 0.25, missing_policy: fail}
        - {metric: cdr_all_a_escape, direction: maximize, transform: identity, weight: 0.10, missing_policy: fail}
        - {metric: sabdab_cdr1_similarity, direction: maximize, transform: identity, weight: 0.05, missing_policy: fail}
        - {metric: sabdab_cdr2_similarity, direction: maximize, transform: identity, weight: 0.05, missing_policy: fail}
        - {metric: protenix_contact_quality, direction: maximize, transform: identity, weight: 0.20, missing_policy: fail}
        - {metric: protenix_structure_quality, direction: maximize, transform: identity, weight: 0.20, missing_policy: fail}
        - {metric: protenix_interface_confidence, direction: maximize, transform: identity, weight: 0.15, missing_policy: fail}
        - {metric: developability_score, direction: maximize, transform: identity, weight: 0.05, missing_policy: fail}
        - {metric: fixed_residue_integrity, direction: maximize, transform: identity, weight: 0.05, missing_policy: fail}
    - role_id: robustness_falsification
      name: de novo Protenix-robust VHH design
      focus: Permit non-native solutions when Protenix interface evidence, VHH empirical plausibility, and developability remain jointly credible.
      soft_objectives: [Protenix interface confidence, Protenix PAE, Protenix contact quality, Protenix structure quality, VHH empirical plausibility, developability]
      complementary_roles: [cdr3_guarded_explore, maturation_epistasis]
      metric_terms:
        - {metric: protenix_interface_confidence, direction: maximize, transform: identity, weight: 0.20, missing_policy: fail}
        - {metric: protenix_interface_pae_quality, direction: maximize, transform: identity, weight: 0.15, missing_policy: fail}
        - {metric: protenix_contact_quality, direction: maximize, transform: identity, weight: 0.15, missing_policy: fail}
        - {metric: protenix_structure_quality, direction: maximize, transform: identity, weight: 0.10, missing_policy: fail}
        - {metric: cdr_all_a_escape, direction: maximize, transform: identity, weight: 0.10, missing_policy: fail}
        - {metric: sabdab_vhh_plausibility, direction: maximize, transform: identity, weight: 0.15, missing_policy: fail}
        - {metric: sabdab_cdr3_similarity, direction: maximize, transform: identity, weight: 0.10, missing_policy: fail}
        - {metric: developability_score, direction: maximize, transform: identity, weight: 0.05, missing_policy: fail}
        - {metric: mutation_sparsity, direction: maximize, transform: identity, weight: 0.05, missing_policy: fail}
  experiment_registry_enabled: true
  experiment_registry_lease_seconds: 3600
  experiment_registry_retry_failed: true
  experiment_registry_replicate_policy: reject

hierarchical_design:
  enabled: false
  global_strategist_enabled: false
  proposal_critic_enabled: true
  llm_critic_enabled: false
  reasoning_audit_enabled: true

evaluator:
  timeout: 43200
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  distributed: false
  use_llm_feedback: false
  enable_artifacts: true
  max_artifact_storage: 134217728

evolution_trace:
  enabled: true
  format: jsonl
  include_code: false
  include_prompts: true
  buffer_size: 1
  compress: false
