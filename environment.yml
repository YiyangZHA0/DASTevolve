name: DASTevolve

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip>=25
  - setuptools>=69
  - wheel
  - pip:
      # PyTorch 2.6+ is distributed as an official pip wheel rather than an
      # official Conda package. CUDA 12.8 runs on a compatible host driver;
      # a separate system CUDA toolkit is not required for this wheel.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.1+cu128
      - ".[gpu]"
